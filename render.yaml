# Render Blueprint: deploy the FastAPI service on Render's native Python 3 runtime.
# No Dockerfile is used on Render. The build installs backend/requirements.txt and the
# start command runs plain python3: idempotent seed first, then uvicorn on $PORT.
# Set secrets and DATABASE_URL in the Render dashboard after creating the service.
services:
  - type: web
    name: hca-system-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: 'python3 -m app.seed_admin && python3 -m uvicorn app.main:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: production
      - key: BOOTSTRAP_ADMIN_ON_STARTUP
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: SEED_ADMIN_USERNAME
        value: admin
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
